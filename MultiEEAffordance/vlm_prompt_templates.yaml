version: "v0.1"
language: "zh-CN"
executor_order:
  - gripper
  - suction
  - hook
  - dexterous_hand

global_instruction: |
  你会看到同一个 3D 物体点云的多视角渲染图。请根据给定任务和末端执行器，
  在每张图像上分割“当前执行器能够完成当前任务的可操作区域”。
  只标注物体表面上真正可用于操作的区域，不要标注背景、阴影、坐标轴或空白区域。
  如果某个视角看不清该区域，请输出空 mask，不要凭空补画。

output_contract: |
  对每张输入视角图像，输出同尺寸二值 mask。
  白色/1 表示可操作区域，黑色/0 表示不可操作区域。
  如果系统支持多通道输出，则按 executor_order 输出 [H, W, 4]。
  如果只测试单执行器，则只输出当前 executor 的 [H, W] mask。

task_definitions:
  pick_up: "抓取并拿起物体，重点是能稳定施力、抬起且不易滑脱的区域。"
  lift_carry: "提起并搬运物体，重点是能承重、稳定抓握/吸附/挂接的区域。"
  open_pull: "拉开或打开可动部件，重点是把手、拉环、门板/抽屉面板等能施加拉力的区域。"
  press_push: "按压或推动物体/部件，重点是按钮、开关、可推动面板、可按压结构。"

executor_definitions:
  gripper: |
    两指夹爪。正区域应是可被两侧夹持并稳定受力的区域，例如把手外侧、细长柄部、
    可夹持边缘、原始 grasp/hold 区域。不要标注大平面中心、孔洞内部、过小按钮、
    细小不稳定结构，或明显只适合吸盘的大平面。
  suction: |
    吸盘。正区域应是局部平整、低曲率、法向一致、面积足够的表面，例如柜门面板、
    抽屉面板、盒子顶面、盘面中心。不要标注孔洞、边缘、细杆、曲率过大区域、
    镂空区域、把手、拉环或细长柄部。
  hook: |
    钩爪。正区域应是可挂接或可勾住的结构，例如把手内孔、拉环、孔洞边界、提手、
    pan handle hole、scissors ring、bag handle。不要标注普通平面、无孔洞表面、按钮、
    或只能吸附不能挂接的光滑区域。
  dexterous_hand: |
    灵巧手。正区域应是类人多指手能稳定接触、包覆、抓握、按压、旋转或精细操作的区域，
    例如把手、杯身、瓶身、柄部、旋钮、按钮。不要把所有能接触的表面都标为正样本，
    也不要标注没有明确操作意义的普通大平面。

single_executor_prompt: |
  任务：{task}
  任务说明：{task_instruction}
  物体类别：{object_category}
  当前末端执行器：{executor}

  请在每张视角图像中分割该执行器完成该任务时的可操作区域。
  判断标准：
  1. 必须符合任务语义；
  2. 必须符合当前执行器的物理接触方式；
  3. 看不清或不确定时宁可少标，不要把普通接触面泛化为正样本；
  4. 如果该执行器对该物体/任务不可行，输出全黑 mask。

multi_executor_prompt: |
  任务：{task}
  任务说明：{task_instruction}
  物体类别：{object_category}

  请分别为 gripper、suction、hook、dexterous_hand 输出四个二值 mask 通道。
  同一个点可以属于多个执行器，但每个通道都必须独立判断，不要因为一个执行器可行就默认其他执行器也可行。
